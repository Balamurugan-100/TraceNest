receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  postgresql:
    endpoint: postgres:5432
    transport: tcp
    username: django
    password: django
    databases:
      - django_otel
    tls:
      insecure: true
    collection_interval: 10s

processors:
  memory_limiter:
    check_interval: 500ms
    limit_mib: 180
    spike_limit_mib: 40

  resource/drop_ephemeral:
    attributes:
      - key: service.instance.id
        action: delete
      - key: process.pid
        action: delete

  batch:
    timeout: 500ms
    send_batch_size: 128
    send_batch_max_size: 256

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: http.route
      - name: db.system
      - name: db.operation
      - name: db.instance
      - name: db.statement
      - name: server.address
      - name: server.port
      - name: error
      - name: span.type
    dimensions_cache_size: 1000

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 100

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: apm
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics, postgresql]
      processors: [memory_limiter, resource/drop_ephemeral, batch]
      exporters: [prometheus]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
